name: OnyxVision
options:
  bundleIdPrefix: com.onyxvision
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: NO
  AD_HOC_CODE_SIGNING_ALLOWED: YES

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: main

targets:
  OnyxVision:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OnyxVision
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    scheme:
      gatherCoverageData: false
    info:
      path: OnyxVision/Resources/Info.plist
    settings:
      PRODUCT_NAME: OnyxVision
      PRODUCT_BUNDLE_IDENTIFIER: com.onyxvision.player
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: OnyxVision/Resources/Info.plist
      MARKETING_VERSION: 2.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      AD_HOC_CODE_SIGNING_ALLOWED: YES
