name: EmbyVision
options:
  bundleIdPrefix: com.embyvision
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: NO

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: master

targets:
  EmbyVision:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EmbyVision
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    scheme:
      gatherCoverageData: false
    info:
      path: EmbyVision/Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.embyvision.player
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: EmbyVision/Resources/Info.plist
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
