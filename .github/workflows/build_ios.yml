name: Build iOS IPA (EmbyVision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        id: build_step
        run: |
          xcodebuild -project EmbyVision.xcodeproj \
            -scheme EmbyVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/EmbyVision.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log

      - name: Upload Build Log If Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/EmbyVision.xcarchive/Products/Applications/EmbyVision.app" build/Payload/
          cd build
          zip -r -9 EmbyVision.ipa Payload
          echo "IPA 打包完成: build/EmbyVision.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyVision-iOS-IPA
          path: build/EmbyVision.ipa
          retention-days: 14
