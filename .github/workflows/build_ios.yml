name: Build iOS IPA (EmbyVision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild -project EmbyVision.xcodeproj \
            -scheme EmbyVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/EmbyVision.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          ARCHIVE_APP=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $ARCHIVE_APP"
          mkdir -p build/Payload
          cp -r "$ARCHIVE_APP" build/Payload/
          cd build
          zip -r -q -9 EmbyVision.ipa Payload
          echo "IPA packaging complete!"
          ls -lh EmbyVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyVision-iOS-IPA
          path: build/EmbyVision.ipa
          retention-days: 14
