name: Build iOS IPA (EmbyVision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application Binary
        run: |
          mkdir -p build
          xcodebuild clean build \
            -project EmbyVision.xcodeproj \
            -scheme EmbyVision \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || {
              echo "### Build Failed Log Tail" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat build.log | grep -E -A 2 -B 1 "error:|fatal error:" || tail -n 60 build.log
              exit 1
            }

      - name: Package Payload into IPA
        run: |
          COMPILED_APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found compiled app: $COMPILED_APP"
          mkdir -p build/Payload
          cp -r "$COMPILED_APP" build/Payload/
          cd build
          zip -r -q -9 EmbyVision.ipa Payload
          echo "### Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Successfully packaged EmbyVision.ipa" >> $GITHUB_STEP_SUMMARY
          ls -lh EmbyVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyVision-iOS-IPA
          path: build/EmbyVision.ipa
          retention-days: 14
