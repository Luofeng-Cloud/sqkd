name: Build iOS IPA (EmbyVision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application Binary
        run: |
          mkdir -p build
          xcodebuild clean build \
            -project EmbyVision.xcodeproj \
            -scheme EmbyVision \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} build/Payload/ \;
          cd build
          zip -r -q -9 EmbyVision.ipa Payload
          echo "IPA packaging complete!"
          ls -lh EmbyVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyVision-iOS-IPA
          path: build/EmbyVision.ipa
          retention-days: 14
