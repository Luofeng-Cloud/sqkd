name: Build iOS IPA (EmbyVision)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0"

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application Binary
        run: |
          mkdir -p build
          xcodebuild clean build \
            -project EmbyVision.xcodeproj \
            -scheme EmbyVision \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1

      - name: Commit Error Log to Repo If Failed
        if: failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build.log
          git commit -m "chore(debug): capture xcodebuild error log" || true
          git push origin main || true

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} build/Payload/ \;
          cd build
          zip -r -q -9 EmbyVision.ipa Payload
          echo "IPA packaging complete!"
          ls -lh EmbyVision.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyVision-iOS-IPA
          path: build/EmbyVision.ipa
          retention-days: 14
